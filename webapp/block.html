<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ Генератор</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #333;
        }

        .block-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
            padding: 40px 30px;
            text-align: center;
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .icon {
            font-size: 80px;
            margin-bottom: 20px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 15px;
            color: #1a1a2e;
        }

        .subtitle {
            font-size: 16px;
            color: #666;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .info-box {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            margin: 25px 0;
            border-left: 4px solid #667eea;
        }

        .info-box p {
            font-size: 14px;
            color: #555;
            line-height: 1.8;
            text-align: left;
        }

        .info-box strong {
            color: #667eea;
            font-weight: 600;
        }

        .telegram-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            padding: 15px 30px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            margin-top: 10px;
        }

        .telegram-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        .telegram-btn:active {
            transform: translateY(0);
        }

        .footer {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            font-size: 12px;
            color: #999;
        }

        .badge {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-top: 10px;
        }

        @media (max-width: 480px) {
            .block-container {
                padding: 30px 20px;
            }
            h1 {
                font-size: 24px;
            }
            .icon {
                font-size: 60px;
            }
        }
    </style>
</head>
<body>
    <div class="block-container">
        <div class="icon">🔒</div>
        <h1>Доступ обмежено</h1>
        <p class="subtitle">Цей додаток працює виключно через Telegram Mini App</p>
        
        <div class="info-box">
            <p>
                <strong>📱 Як відкрити додаток:</strong><br>
                1. Відкрийте Telegram<br>
                2. Знайдіть бота <strong>@YourGeneratorBot</strong><br>
                3. Натисніть кнопку <strong>"Відкрити додаток"</strong>
            </p>
        </div>

        <span class="badge">⚡ Telegram Mini App</span>

        <div class="footer">
            © 2026 Generator Management System<br>
            Для авторизованих користувачів
        </div>
    </div>

    <script>
        // Анімація іконки при завантаженні
        document.addEventListener('DOMContentLoaded', () => {
            const icon = document.querySelector('.icon');
            icon.style.opacity = '0';
            setTimeout(() => {
                icon.style.transition = 'opacity 0.6s ease-out';
                icon.style.opacity = '1';
            }, 200);
        });
    </script>
</body>
</html>

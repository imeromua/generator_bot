# Compose override for running a parallel TEST instance on the same host.
#
# Usage:
#   docker compose -p genbot_test -f docker-compose.yml -f docker-compose.test.yml up -d
#
# Purpose:
# - Avoid conflicts with the main stack because docker-compose.yml has fixed container_name values.
# - Avoid host port collisions by removing postgres/redis published ports.

services:
  bot:
    container_name: generator_bot_test

  postgres:
    container_name: generator_bot_db_test
    ports: []

  redis:
    container_name: generator_bot_redis_test
    ports: []

  adminer:
    container_name: generator_bot_adminer_test
    ports:
      - "8081:8080"

<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>ServiceDesk — Dashboard</title>
  <link rel="stylesheet" href="/sd/css/sd-main.css">
  <link rel="manifest" href="/sd/manifest.json">
  <link rel="icon" type="image/svg+xml" href="/sd/icons/icon.svg">
</head>
<body>

<!-- ── App shell ──────────────────────────────────────────────── -->
<div class="app-shell">

  <!-- Mobile sidebar overlay -->
  <div id="sidebar-overlay" class="sidebar-overlay"></div>

  <!-- ── Sidebar (desktop + slide-in mobile) ──────────────────── -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect width="28" height="28" rx="6" fill="#238636"/>
        <polygon points="17,4 10,15 14,15 11,24 18,13 14,13" fill="#ffffff"/>
      </svg>
      <div>
        <div class="brand-name">ServiceDesk</div>
        <div class="brand-sub">Генератори</div>
      </div>
    </div>

    <nav>
      <ul class="sidebar-nav">
        <li>
          <a href="#dashboard" data-route="dashboard">
            <svg class="nav-icon" viewBox="0 0 16 16" fill="currentColor"><circle cx="8" cy="8" r="7" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="8" cy="8" r="3"/></svg>
            Dashboard
          </a>
        </li>
        <li>
          <a href="#events" data-route="events">
            <svg class="nav-icon" viewBox="0 0 16 16" fill="currentColor"><path d="M2 2h12v1H2V2zm0 3h12v1H2V5zm0 3h8v1H2V8zm0 3h10v1H2v-1z"/></svg>
            Події
          </a>
        </li>
        <li>
          <a href="#maintenance" data-route="maintenance">

            ТО
          </a>
        </li>
        <li>
          <a href="#fuel" data-route="fuel">
            <svg class="nav-icon" viewBox="0 0 16 16" fill="currentColor"><path d="M3 2h7a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1zm1 2v2h5V4H4zm7 0h.5a1.5 1.5 0 0 1 1.5 1.5v5A1.5 1.5 0 0 1 11.5 12H11V4z"/></svg>
            Паливо

        </li>
        <li>

        </li>
        <li>
          <a href="#shifts" data-route="shifts">

            Зміни
          </a>
        </li>

            Адмін
          </a>

        </li>
        <li data-admin-only class="hidden">

            <svg class="nav-icon" viewBox="0 0 16 16" fill="currentColor"><path d="M14 4.5V14a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V2a2 2 0 0 1 2-2h5.5L14 4.5zm-3 0A1.5 1.5 0 0 1 9.5 3V1H4a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V4.5h-2z"/><path d="M4.5 12.5A.5.5 0 0 1 5 12h3a.5.5 0 0 1 0 1H5a.5.5 0 0 1-.5-.5zm0-2A.5.5 0 0 1 5 10h6a.5.5 0 0 1 0 1H5a.5.5 0 0 1-.5-.5zm0-2A.5.5 0 0 1 5 8h6a.5.5 0 0 1 0 1H5a.5.5 0 0 1-.5-.5zm0-2A.5.5 0 0 1 5 6h6a.5.5 0 0 1 0 1H5a.5.5 0 0 1-.5-.5z"/></svg>
            Звіти
          </a>
        </li>
        <li data-admin-only class="hidden">
          <a href="#users" data-route="users">
            <svg class="nav-icon" viewBox="0 0 16 16" fill="currentColor"><path d="M15 14s1 0 1-1-1-4-5-4-5 3-5 4 1 1 1 1h8zm-7.978-1A.261.261 0 0 1 7 12.996c.001-.264.167-1.03.76-1.72C8.312 10.629 9.282 10 11 10c1.717 0 2.687.63 3.24 1.276.593.69.758 1.457.76 1.72l-.008.002-.014.002H7.022zM11 7a2 2 0 1 0 0-4 2 2 0 0 0 0 4zm3-2a3 3 0 1 1-6 0 3 3 0 0 1 6 0zM6.936 9.28a5.88 5.88 0 0 0-1.23-.247A7.35 7.35 0 0 0 5 9c-4 0-5 3-5 4 0 .667.333 1 1 1h4.216A2.238 2.238 0 0 1 5 13c0-1.01.377-2.042 1.09-2.904.243-.294.526-.569.846-.816zM4.92 10A5.493 5.493 0 0 0 4 13H1c0-.26.164-1.03.76-1.724.545-.636 1.492-1.256 3.16-1.275zM1.5 5.5a3 3 0 1 1 6 0 3 3 0 0 1-6 0zm3-2a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"/></svg>
            Користувачі
          </a>
        </li>
        <li>
          <a href="#profile" data-route="profile">
            <svg class="nav-icon" viewBox="0 0 16 16" fill="currentColor"><path d="M3 14s-1 0-1-1 1-4 6-4 6 3 6 4-1 1-1 1H3zm5-6a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/></svg>
            Профіль
          </a>
        </li>
      </ul>
    </nav>

    <div class="sidebar-footer">
      <div class="user-info">
        <div class="user-name" id="sidebar-user-name">…</div>
        <div class="user-role text-muted" id="sidebar-user-role"></div>
      </div>
      <button id="btn-logout" class="btn btn-ghost" style="width:100%;font-size:0.8rem">Вийти</button>
    </div>
  </aside>

  <!-- ── Main area ──────────────────────────────────────────────── -->
  <div class="main-area">
    <header class="topbar">
      <div class="flex items-center gap-2">
        <button id="menu-toggle" class="menu-toggle" aria-label="Відкрити меню">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor"><path d="M2 5h16v1.5H2V5zm0 4.5h16V11H2V9.5zm0 4.5h16v1.5H2V14z"/></svg>
        </button>
        <h1 id="topbar-title">Dashboard</h1>
      </div>
      <div class="topbar-right">
        <button class="btn btn-ghost" style="font-size:0.8rem" id="topbar-logout" onclick="doLogout()">Вийти</button>
      </div>
    </header>

    <main class="page-content">
      <div class="section-panel active" id="panel-dashboard">
        <div class="loader-center"><div class="loader"></div></div>
      </div>
      <div class="section-panel" id="panel-events"></div>
      <div class="section-panel" id="panel-maintenance"></div>
      <div class="section-panel" id="panel-fuel"></div>
      <div class="section-panel" id="panel-schedule"></div>
      <div class="section-panel" id="panel-shifts"></div>
      <div class="section-panel" id="panel-admin"></div>
      <div class="section-panel" id="panel-analytics"></div>
      <div class="section-panel" id="panel-reports"></div>
      <div class="section-panel" id="panel-users"></div>
      <div class="section-panel" id="panel-profile"></div>
    </main>
  </div>

</div>

  <ul>
    <li>

        <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8.354 1.146a.5.5 0 0 0-.708 0l-6 6A.5.5 0 0 0 1.5 7.5v7a.5.5 0 0 0 .5.5h4.5a.5.5 0 0 0 .5-.5v-4h2v4a.5.5 0 0 0 .5.5H14a.5.5 0 0 0 .5-.5v-7a.5.5 0 0 0-.146-.354L13 5.793V2.5a.5.5 0 0 0-.5-.5h-1a.5.5 0 0 0-.5.5v1.293L8.354 1.146z"/></svg>

    </li>
    <li>
      <a href="#events" data-route="events">
        <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M2 2h12v1H2V2zm0 3h12v1H2V5zm0 3h8v1H2V8zm0 3h10v1H2v-1z"/></svg>
        <span>Події</span>
      </a>
    </li>
    <li>
      <a href="#fuel" data-route="fuel">
        <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M3 2h7a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1zm1 2v2h5V4H4zm7 0h.5a1.5 1.5 0 0 1 1.5 1.5v5A1.5 1.5 0 0 1 11.5 12H11V4z"/></svg>
        <span>Паливо</span>
      </a>
    </li>
    <li>
      <a href="#schedule" data-route="schedule">
        <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M3.5 0a.5.5 0 0 1 .5.5V1h8V.5a.5.5 0 0 1 1 0V1h1a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V3a2 2 0 0 1 2-2h1V.5a.5.5 0 0 1 .5-.5zM1 4v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V4H1zm2 2h2v2H3V6zm3 0h2v2H6V6zm3 0h2v2H9V6z"/></svg>
        <span>Розклад</span>
      </a>
    </li>
    <li>
      <a href="#profile" data-route="profile">
        <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M3 14s-1 0-1-1 1-4 6-4 6 3 6 4-1 1-1 1H3zm5-6a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/></svg>

    </li>
  </ul>
</nav>

<!-- ── Toast container ─────────────────────────────────────────── -->
<div id="toast-container" class="toast-container" aria-live="polite"></div>

<!-- ── Scripts ─────────────────────────────────────────────────── -->
<script src="/sd/js/sd-auth.js"></script>
<script src="/sd/js/sd-api.js"></script>
<script src="/sd/js/sd-router.js"></script>
<script src="/sd/js/sd-dashboard.js"></script>

</body>
</html>

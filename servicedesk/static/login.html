<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d1117">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>ServiceDesk — Вхід</title>
  <link rel="stylesheet" href="/sd/css/sd-main.css">
  <link rel="manifest" href="/sd/manifest.json">
  <link rel="icon" type="image/svg+xml" href="/sd/icons/icon.svg">
</head>
<body class="login-page">

  <div class="login-card">
    <!-- Logo / branding -->
    <div class="login-logo">
      <svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect width="48" height="48" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
        <!-- Generator bolt icon -->
        <polygon points="28,8 18,26 24,26 20,40 30,22 24,22" fill="#238636"/>
      </svg>
      <h1>ServiceDesk</h1>
      <p>Система управління генераторами</p>
    </div>

    <!-- Error / info messages -->
    <div id="login-error" class="alert alert-error hidden" role="alert"></div>

    <!-- Login form -->
    <form id="login-form" class="login-form" novalidate>
      <div class="form-group">
        <label for="field-login">Логін</label>
        <input
          id="field-login"
          name="login"
          type="text"
          class="input"
          placeholder="Введіть логін"
          autocomplete="username"
          required
          autofocus
        >
      </div>

      <div class="form-group">
        <label for="field-password">Пароль</label>
        <div class="input-group">
          <input
            id="field-password"
            name="password"
            type="password"
            class="input"
            placeholder="Введіть пароль"
            autocomplete="current-password"
            required
          >
          <button
            type="button"
            class="input-action"
            id="toggle-password"
            aria-label="Показати/сховати пароль"
            title="Показати/сховати пароль"
          >
            <!-- Eye icon (show) -->
            <svg id="eye-show" width="16" height="16" viewBox="0 0 16 16" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
              <path d="M8 3C4.5 3 1.5 5.5 0 8c1.5 2.5 4.5 5 8 5s6.5-2.5 8-5c-1.5-2.5-4.5-5-8-5zm0 8a3 3 0 1 1 0-6 3 3 0 0 1 0 6zm0-5a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"/>
            </svg>
            <!-- Eye-off icon (hide) -->
            <svg id="eye-hide" width="16" height="16" viewBox="0 0 16 16" fill="currentColor" xmlns="http://www.w3.org/2000/svg" class="hidden">
              <path d="M13.36 2.64 2.64 13.36l.7.7 1.92-1.92C5.95 12.68 6.96 13 8 13c3.5 0 6.5-2.5 8-5a9.36 9.36 0 0 0-2.64-3.66zm-5.36 8.36a3 3 0 0 1-2.83-4.01L6.3 8.12A2 2 0 0 0 9.88 9.7l1.13-1.13A3 3 0 0 1 8 11zM0 8c1.5 2.5 4.5 5 8 5 .46 0 .91-.04 1.35-.1L8 11.5A3 3 0 0 1 5 8.5c0-.09 0-.18.01-.27L2.99 6.21A9.24 9.24 0 0 0 0 8zm5.36-4.36A9.22 9.22 0 0 1 8 3c3.5 0 6.5 2.5 8 5a9.4 9.4 0 0 1-1.82 2.45L12.83 9.1A3 3 0 0 0 9.1 5.17l-1.35-1.35C8.5 3.83 9.24 3.5 10 3.27"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Remember me -->
      <div class="remember-row">
        <input type="checkbox" id="remember-me" name="remember">
        <label for="remember-me" style="color:var(--text);cursor:pointer">Запам'ятати мене</label>
      </div>

      <!-- Submit button with loader -->
      <button type="submit" id="login-btn" class="btn btn-primary btn-block">
        <span id="login-btn-text">Увійти</span>
        <span id="login-loader" class="loader hidden"></span>
      </button>
    </form>
  </div>

  <!-- Scripts -->
  <script src="/sd/js/sd-auth.js"></script>
  <script src="/sd/js/sd-api.js"></script>
  <script>
    // Redirect if already authenticated
    if (SD_AUTH.isAuthenticated()) {
      window.location.replace('/sd/dashboard.html');
    }

    const form     = document.getElementById('login-form');
    const errorEl  = document.getElementById('login-error');
    const btnText  = document.getElementById('login-btn-text');
    const loader   = document.getElementById('login-loader');
    const btnLogin = document.getElementById('login-btn');

    // Show / hide password toggle
    const pwField    = document.getElementById('field-password');
    const toggleBtn  = document.getElementById('toggle-password');
    const eyeShow    = document.getElementById('eye-show');
    const eyeHide    = document.getElementById('eye-hide');

    toggleBtn.addEventListener('click', () => {
      const isPassword = pwField.type === 'password';
      pwField.type = isPassword ? 'text' : 'password';
      eyeShow.classList.toggle('hidden', isPassword);
      eyeHide.classList.toggle('hidden', !isPassword);
    });

    // Form submit handler
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.classList.add('hidden');
      errorEl.textContent = '';

      const login    = document.getElementById('field-login').value.trim();
      const password = document.getElementById('field-password').value;
      const remember = document.getElementById('remember-me').checked;

      if (!login || !password) {
        errorEl.textContent = 'Заповніть усі поля';
        errorEl.classList.remove('hidden');
        return;
      }

      // Show loader
      btnText.classList.add('hidden');
      loader.classList.remove('hidden');
      btnLogin.disabled = true;

      try {
        const data = await api.auth.login(login, password);
        SD_AUTH.saveTokens(data.access_token, data.refresh_token, remember);
        if (data.user) SD_AUTH.saveUser(data.user);
        window.location.replace('/sd/dashboard.html');
      } catch (err) {
        errorEl.textContent = err.message || 'Помилка входу';
        errorEl.classList.remove('hidden');
        btnText.classList.remove('hidden');
        loader.classList.add('hidden');
        btnLogin.disabled = false;
      }
    });
  </script>
</body>
</html>

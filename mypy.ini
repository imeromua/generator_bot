# Mypy configuration for strict type checking
# Run: mypy . --config-file mypy.ini

[mypy]
python_version = 3.10

# ==================== STRICTNESS ====================
# Enable strict mode (equivalent to all strict flags)
strict = False  # We enable components individually for flexibility

# Type checking strictness
warn_return_any = True
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
strict_equality = True
check_untyped_defs = True

# Require type annotations
disallow_untyped_defs = True
disallow_any_unimported = False
disallow_incomplete_defs = True
disallow_untyped_decorators = False  # aiogram uses untyped decorators

# ==================== IMPORTS ====================
ignore_missing_imports = True
follow_imports = normal
no_implicit_reexport = False  # Allow implicit re-exports

# ==================== OUTPUT ====================
show_error_codes = True
show_error_context = True
pretty = True
color_output = True
error_summary = True
show_column_numbers = True

# ==================== PLATFORM ====================
platform = linux

# ==================== PER-MODULE OVERRIDES ====================
# Relax strictness for test files
[mypy-tests.*]
disallow_untyped_defs = False
check_untyped_defs = False

# Third-party libraries without stubs
[mypy-gspread.*]
ignore_missing_imports = True

[mypy-google.*]
ignore_missing_imports = True

[mypy-aiohttp.*]
ignore_missing_imports = True

[mypy-aiogram.*]
ignore_missing_imports = True

[mypy-pandas.*]
ignore_missing_imports = True

[mypy-openpyxl.*]
ignore_missing_imports = True

# Admin bot (legacy script)
[mypy-admin_bot]
disallow_untyped_defs = False

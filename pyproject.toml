[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "generator-bot"
version = "2.2.0"
description = "Telegram bot for generator management with Google Sheets sync"
authors = [{name = "imeromua", email = "imerom25@gmail.com"}]
requires-python = ">=3.11"
readme = "README.md"
# ВИПРАВЛЕННЯ 1: Ліцензія тепер має бути рядком (SPDX expression)
license = "MIT"

dependencies = [
    "aiogram>=3.24.0,<4.0",
    "aiohttp>=3.8,<4.0",
    "gspread",
    "google-auth",
    "google-auth-oauthlib",
    "google-auth-httplib2",
    "python-dotenv",
    "pandas",
    "openpyxl",
    "aiosqlite>=0.19.0",
    "psycopg[binary]>=3.1",
    "psycopg_pool>=3.1",
    "redis>=5.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "pytest-mock>=3.12",
    "mypy>=1.8",
    "black>=24.0",
    "isort>=5.13",
    "ruff>=0.2",
    "pre-commit>=3.6",
    "types-redis",
    "types-aiofiles",
]

# ВИПРАВЛЕННЯ 2: Явне визначення пакетів для flat-layout
[tool.setuptools]
packages = ["database", "handlers", "keyboards", "middlewares", "services", "utils"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "C90",   # mccabe complexity
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "A",     # flake8-builtins
    "COM",   # flake8-commas
    "C4",    # flake8-comprehensions
    "DTZ",   # flake8-datetimez
    "ISC",   # flake8-implicit-str-concat
    "ICN",   # flake8-import-conventions
    "PIE",   # flake8-pie
    "PT",    # flake8-pytest-style
    "Q",     # flake8-quotes
    "RSE",   # flake8-raise
    "RET",   # flake8-return
    "SIM",   # flake8-simplify
    "TID",   # flake8-tidy-imports
    "ARG",   # flake8-unused-arguments
    "PTH",   # flake8-use-pathlib
    "ERA",   # eradicate (commented out code)
    "PL",    # pylint
    "TRY",   # tryceratops
    "RUF",   # ruff-specific rules
]
ignore = [
    "E501",    # Line too long (handled by black)
    "PLR0913", # Too many arguments
    "TRY003",  # Avoid specifying long messages outside exception class
    "COM812",  # Trailing comma missing (conflicts with black)
    "ISC001",  # Implicit string concatenation (conflicts with black)
]

[tool.black]
line-length = 120
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 120

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "generator-bot"
version = "2.2.0"
description = "Telegram bot for generator management with Google Sheets sync"
authors = [{name = "imeromua", email = "imerom25@gmail.com"}]
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"

dependencies = [
    "aiogram>=3.24.0,<4.0",
    "aiohttp>=3.8,<4.0",
    "gspread",
    "google-auth",
    "google-auth-oauthlib",
    "google-auth-httplib2",
    "python-dotenv",
    "pandas",
    "openpyxl",
    "aiosqlite>=0.19.0",
    "psycopg[binary]>=3.1",
    "psycopg_pool>=3.1",
    "redis>=5.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "pytest-mock>=3.12",
    "mypy>=1.8",
    "black>=24.0",
    "isort>=5.13",
    "ruff>=0.2",
    "pre-commit>=3.6",
    "types-redis",
    "types-aiofiles",
    "bandit[toml]>=1.7",
    "safety>=3.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["bot*", "database*", "handlers*", "keyboards*", "middlewares*", "services*", "utils*"]
namespaces = false

[tool.setuptools]
py-modules = ["config", "main"]

# ==================== RUFF ====================
[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C90", # mccabe complexity
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "A",   # flake8-builtins
    "COM", # flake8-commas
    "C4",  # flake8-comprehensions
    "DTZ", # flake8-datetimez
    "PIE", # flake8-pie
    "PT",  # flake8-pytest-style
    "Q",   # flake8-quotes
    "RSE", # flake8-raise
    "RET", # flake8-return
    "SIM", # flake8-simplify
    "TID", # flake8-tidy-imports
    "ARG", # flake8-unused-arguments
    "PTH", # flake8-use-pathlib
    "ERA", # eradicate
    "PL",  # pylint
    "TRY", # tryceratops
    "RUF", # ruff-specific
]
ignore = [
    "E501",    # line too long (handled by black)
    "PLR0913", # too many arguments
    "TRY003",  # raise-vanilla-args
    "COM812",  # missing-trailing-comma (conflicts with formatter)
    "ISC001",  # single-line-implicit-string-concatenation (conflicts with formatter)
]

# ==================== BLACK ====================
[tool.black]
line-length = 120
target-version = ['py310', 'py311', 'py312']
skip-string-normalization = false

# ==================== ISORT ====================
[tool.isort]
profile = "black"
line_length = 120
known_first_party = ["bot", "database", "handlers", "keyboards", "middlewares", "services", "utils", "config"]

# ==================== MYPY ====================
[tool.mypy]
python_version = "3.10"

# Strict mode components
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true
check_untyped_defs = true

# Incremental type checking
disallow_untyped_defs = true
disallow_any_unimported = false
disallow_incomplete_defs = true
disallow_untyped_decorators = false  # aiogram decorators

# Import handling
ignore_missing_imports = true
follow_imports = "normal"

# Output
show_error_codes = true
show_error_context = true
pretty = true

# Platform
platform = "linux"

# Per-module overrides for gradual typing
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "gspread.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "google.*"
ignore_missing_imports = true

# ==================== PYTEST ====================
[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--showlocals",
    "--tb=short",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

# ==================== COVERAGE ====================
[tool.coverage.run]
source = ["bot", "database", "handlers", "keyboards", "middlewares", "services", "utils", "config", "main"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/site-packages/*",
    "admin_bot.py",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@abstractmethod",
    "@abc.abstractmethod",
]

# ==================== BANDIT ====================
[tool.bandit]
targets = ["bot", "database", "handlers", "keyboards", "middlewares", "services", "utils", "config.py", "main.py"]
exclude_dirs = ["tests", ".venv", "venv"]
skips = ["B101", "B601"]  # assert_used, paramiko_calls

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "generator-bot"
version = "2.2.0"
description = "Telegram bot for generator management with Google Sheets sync"
authors = [{name = "imeromua", email = "imerom25@gmail.com"}]
requires-python = ">=3.11"
readme = "README.md"
# ВИПРАВЛЕННЯ 1: Ліцензія як рядок
license = "MIT"

dependencies = [
    "aiogram>=3.24.0,<4.0",
    "aiohttp>=3.8,<4.0",
    "gspread",
    "google-auth",
    "google-auth-oauthlib",
    "google-auth-httplib2",
    "python-dotenv",
    "pandas",
    "openpyxl",
    "aiosqlite>=0.19.0",
    "psycopg[binary]>=3.1",
    "psycopg_pool>=3.1",
    "redis>=5.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "pytest-mock>=3.12",
    "mypy>=1.8",
    "black>=24.0",
    "isort>=5.13",
    "ruff>=0.2",
    "pre-commit>=3.6",
    "types-redis",
    "types-aiofiles",
]

# ВИПРАВЛЕННЯ 2: Використовуємо find directive, це надійніше для setuptools
[tool.setuptools.packages.find]
where = ["."]
include = ["database*", "handlers*", "keyboards*", "middlewares*", "services*", "utils*"]
namespaces = false

# Додатково: включаємо кореневі модулі, якщо вони потрібні (config.py)
[tool.setuptools]
py-modules = ["config", "main"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "C90", "N", "UP", "B", "A", "COM", "C4", "DTZ", "PIE", "PT", "Q", "RSE", "RET", "SIM", "TID", "ARG", "PTH", "ERA", "PL", "TRY", "RUF"]
ignore = ["E501", "PLR0913", "TRY003", "COM812", "ISC001"]

[tool.black]
line-length = 120
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 120

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

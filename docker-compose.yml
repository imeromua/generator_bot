version: '3.9'

services:
  # Main bot application
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: generator_bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DB_BACKEND=postgres
      - POSTGRES_DSN=postgresql://botuser:botpass@postgres:5432/generator_bot
      - REDIS_ENABLED=1
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./logs:/app/logs
      - ./service_account.json:/app/service_account.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bot_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # PostgreSQL database
  postgres:
    image: postgres:15-alpine
    container_name: generator_bot_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: botuser
      POSTGRES_PASSWORD: botpass
      POSTGRES_DB: generator_bot
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=uk_UA.UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U botuser -d generator_bot"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bot_network
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # Redis cache
  redis:
    image: redis:7-alpine
    container_name: generator_bot_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bot_network
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # PostgreSQL admin interface (optional, for development)
  adminer:
    image: adminer:latest
    container_name: generator_bot_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres
    networks:
      - bot_network
    profiles:
      - dev

networks:
  bot_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

name: CI/CD Pipeline

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  PYTHON_VERSION_DEFAULT: "3.12"

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python ${{ env.PYTHON_VERSION_DEFAULT }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION_DEFAULT }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff black isort mypy types-redis types-aiofiles
      
      - name: Run ruff
        run: |
          echo "::group::Ruff Linting"
          ruff check . --output-format=github
          echo "::endgroup::"
        continue-on-error: true
      
      - name: Check black formatting
        run: |
          echo "::group::Black Format Check"
          black --check --diff .
          echo "::endgroup::"
        continue-on-error: true
      
      - name: Check isort
        run: |
          echo "::group::Isort Import Order Check"
          isort --check-only --diff .
          echo "::endgroup::"
        continue-on-error: true

  type-check:
    name: Type Checking (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python ${{ env.PYTHON_VERSION_DEFAULT }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION_DEFAULT }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      
      - name: Create dummy .env
        run: |
          cat > .env << EOF
          BOT_TOKEN=test_token
          SHEET_ID_PROD=test_id
          SHEET_ID_TEST=test_id
          ADMINS=123456789
          EOF
      
      - name: Run mypy strict type checking
        run: |
          echo "::group::Mypy Type Checking"
          mypy . --config-file mypy.ini --html-report mypy-report
          echo "::endgroup::"
        continue-on-error: true
      
      - name: Upload mypy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mypy-type-coverage
          path: mypy-report/
          retention-days: 30

  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: generator_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      
      - name: Create test .env
        run: |
          cat > .env << EOF
          BOT_TOKEN=test_token_12345
          SHEET_ID_PROD=test_sheet_id
          SHEET_ID_TEST=test_sheet_id
          ADMINS=123456789
          MODE=TEST
          DB_BACKEND=sqlite
          SQLITE_PATH=:memory:
          REDIS_ENABLED=0
          SHEETS_RUNTIME_ENABLED=0
          EOF
      
      - name: Run tests with coverage
        run: |
          echo "::group::Running Tests"
          pytest -v --cov --cov-report=xml --cov-report=html --cov-report=term
          echo "::endgroup::"
        env:
          POSTGRES_DSN: postgresql://testuser:testpass@localhost:5432/generator_test
          REDIS_URL: redis://localhost:6379/0
      
      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ matrix.python-version }}
          path: |
            htmlcov/
            coverage.xml
          retention-days: 30
      
      - name: Coverage comment (PR only)
        if: github.event_name == 'pull_request' && matrix.python-version == '3.12'
        uses: py-cov-action/python-coverage-comment-action@v3
        with:
          GITHUB_TOKEN: ${{ github.token }}
          MINIMUM_GREEN: 60
          MINIMUM_ORANGE: 40

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python ${{ env.PYTHON_VERSION_DEFAULT }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION_DEFAULT }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      
      - name: Run safety check
        run: |
          echo "::group::Safety Security Check"
          safety check --json || echo "::warning::Some vulnerabilities found"
          echo "::endgroup::"
        continue-on-error: true
      
      - name: Run bandit security scan
        run: |
          echo "::group::Bandit Security Scan"
          bandit -r . -f json -o bandit-report.json || echo "::warning::Security issues found"
          echo "::endgroup::"
        continue-on-error: true
      
      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit-report.json
          retention-days: 30

  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [lint, type-check, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: generator-bot:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Test Docker image
        run: |
          docker images
          echo "✅ Docker image built successfully"

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [lint, type-check, test, security]
    if: always()
    steps:
      - name: Check job results
        run: |
          echo "## CI/CD Pipeline Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Lint: ${{ needs.lint.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Type Check: ${{ needs.type-check.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Tests: ${{ needs.test.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Security: ${{ needs.security.result }}" >> $GITHUB_STEP_SUMMARY

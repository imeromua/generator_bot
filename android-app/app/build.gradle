plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'ua.imero.servicedesk'
    compileSdk 34

    defaultConfig {
        applicationId "ua.imero.servicedesk"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // AndroidX AppCompat — required by SplashActivity / AppCompatActivity
    implementation 'androidx.appcompat:appcompat:1.7.0'

    // Custom Tabs + Trusted Web Activity support (androidx.browser)
    implementation 'androidx.browser:browser:1.8.0'

    // Android Browser Helper — TwaLauncher and TWA lifecycle helpers
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}

# Pre-commit hooks configuration
# Install: pre-commit install
# Run manually: pre-commit run --all-files
# Update hooks: pre-commit autoupdate

repos:
  # General file cleanup
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending
        args: ['--fix=lf']
      - id: detect-private-key
      - id: check-ast  # Check Python syntax
      - id: debug-statements  # Check for debugger imports

  # Python code formatting with black
  - repo: https://github.com/psf/black
    rev: 24.1.1
    hooks:
      - id: black
        language_version: python3.11
        args: ['--config=pyproject.toml']

  # Import sorting with isort
  - repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ['--settings-path=pyproject.toml']

  # Fast linting with ruff (replaces flake8, pylint, etc.)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.2.1
    hooks:
      - id: ruff
        args: ['--fix', '--exit-non-zero-on-fix', '--config=pyproject.toml']
      - id: ruff-format

  # Type checking with mypy (strict mode)
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        additional_dependencies:
          - types-redis
          - types-aiofiles
          - pydantic>=2.0
          - aiogram>=3.0
        args: [
          '--config-file=mypy.ini',
          '--ignore-missing-imports',
          '--show-error-codes',
        ]
        # Type check all Python files
        pass_filenames: true
        # Exclude test files from strict checking
        exclude: '^tests/'

  # Security checks with bandit
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.6
    hooks:
      - id: bandit
        args: ['-c', 'pyproject.toml', '-ll']
        additional_dependencies: ['bandit[toml]']
        # Skip test files
        exclude: '^tests/'

  # Docstring style checking
  - repo: https://github.com/PyCQA/pydocstyle
    rev: 6.3.0
    hooks:
      - id: pydocstyle
        args: [
          '--convention=google',
          '--add-ignore=D100,D104,D105,D107',  # Missing docstrings
        ]
        exclude: '^tests/'

# Configuration
default_language_version:
  python: python3.11

default_stages: [commit, push]

# Files to exclude from all hooks
exclude: |
  (?x)^(
      \.git/|
      \.mypy_cache/|
      \.pytest_cache/|
      \.ruff_cache/|
      \.venv/|
      venv/|
      build/|
      dist/|
      .*\.egg-info/|
      __pycache__/|
      \.coverage|
      htmlcov/|
      \.env|
      service_account\.json
  )

# Performance: run hooks in parallel
fail_fast: false
